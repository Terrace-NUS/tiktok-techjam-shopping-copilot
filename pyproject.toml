[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-copilot"
version = "0.1.0"
description = "Conversational shopping copilot for TikTok TechJam 2026."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<3",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shopping_copilot*"]
namespaces = false

[tool.setuptools.package-data]
shopping_copilot = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "evaluator", "starter"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
