[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-copilot"
version = "0.1.0"
description = "APERTURE: a catalogue-grounded shopping copilot powered by Intent Transparency."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyunormalize==17.0.0",
    "rfc8785==0.1.4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
catalog-category = "shopping_copilot.catalog.semantic.category.cli:main"
catalog-facet-gate-a = "shopping_copilot.catalog.semantic.facet.gate_a_cli:main"
catalog-facet-profile = "shopping_copilot.catalog.semantic.facet.cli:main"
catalog-facet-resolution = "shopping_copilot.catalog.semantic.facet.resolution_cli:main"
catalog-facet-gate-b-review = "shopping_copilot.catalog.semantic.facet.gate_b_cli:main"
catalog-facet-gate-b = "shopping_copilot.catalog.semantic.facet.gate_b_approval_cli:main"
catalog-runtime-projection = "shopping_copilot.catalog.semantic.runtime.cli:main"
catalog-semantic-release = "shopping_copilot.catalog.semantic.release.cli:main"
catalog-profile = "shopping_copilot.catalog.profiling.cli:main"
retrieval-dense = "shopping_copilot.retrieval.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<3",
    "numpy==2.2.6",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
retrieval = [
    "numpy==2.2.6",
    "sentence-transformers==5.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shopping_copilot*"]
namespaces = false

[tool.setuptools.package-data]
shopping_copilot = ["py.typed"]

[tool.setuptools.data-files]
"." = ["THIRD_PARTY_NOTICES.md"]
licenses = ["licenses/UNICODE-3.0.txt"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "evaluator", "starter"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
